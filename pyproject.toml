[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["app"]
testpaths = ["app"]
python_files = ["tests.py", "test_*.py", "*_test.py"]

[tool.coverage.run]
source = ["app"]
relative_files = true
branch = true
omit = [
    "*/tests/*",
    "*/tests.py",
    "*/test_*.py",
    "*/migrations/*",
    "app/manage.py",
]
