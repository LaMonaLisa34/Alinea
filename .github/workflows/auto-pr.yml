name: Automatic pull requests

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HEAD_BRANCH: ${{ github.ref_name }}

    steps:
      - name: Create pull request if needed
        shell: bash
        run: |
          set -euo pipefail

          case "$HEAD_BRANCH" in
            dev) base="staging" ;;
            staging) base="main" ;;
            *) base="dev" ;;
          esac

          existing=$(gh pr list \
            --head "$HEAD_BRANCH" \
            --base "$base" \
            --state open \
            --json number \
            --jq 'length')

          if [ "$existing" -gt 0 ]; then
            echo "Une PR existe déjà : les nouveaux commits l'alimentent."
            exit 0
          fi

          changes=$(gh api \
            "repos/$GH_REPO/compare/$base...$HEAD_BRANCH" \
            --jq '.files | length')

          if [ "$changes" -eq 0 ]; then
            echo "Aucune différence à intégrer."
            exit 0
          fi

          cat > "$RUNNER_TEMP/pr-body.md" <<'EOF'
          PR créée automatiquement.

          À compléter : objectif, issues concernées et vérifications effectuées.

          La fusion reste manuelle après vérification.
          EOF

          gh pr create \
            --head "$HEAD_BRANCH" \
            --base "$base" \
            --title "$HEAD_BRANCH → $base" \
            --body-file "$RUNNER_TEMP/pr-body.md"
