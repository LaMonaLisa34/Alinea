name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - dev
      - staging
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Python lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Retrieve repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: python -m pip install ruff==0.17.3

      - name: Check Python code
        run: python -m ruff check --output-format=github app/

      - name: Check Python formatting
        run: python -m ruff format --check app/
