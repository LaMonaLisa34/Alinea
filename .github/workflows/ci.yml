name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - dev
      - staging
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Python lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    env:
      POSTGRES_DB: alinea_ci
      POSTGRES_USER: alinea_ci
      POSTGRES_PASSWORD: ci_only_password
      POSTGRES_HOST: "127.0.0.1"
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: "ci-only-key-not-for-production"

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: alinea_ci
          POSTGRES_USER: alinea_ci
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alinea_ci -d alinea_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Retrieve repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: python -m pip install ruff==0.17.3

      - name: Check Python code
        run: python -m ruff check --output-format=github app/

      - name: Check Python formatting
        run: python -m ruff format --check app/

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v
